<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Bomber - Рабочая версия</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #3742fa;
            --success: #2ed573;
            --dark: #2f3542;
            --light: #f1f2f6;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #ff6b81 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: float 20s linear infinite;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-20px, -20px) rotate(360deg); }
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        
        .content {
            padding: 40px;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .service-card {
            background: var(--light);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .service-card.active {
            border-color: var(--success);
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
        }
        
        .service-card .icon {
            font-size: 2em;
            margin-bottom: 8px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }
        
        input, select {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary);
        }
        
        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #ff6b81 100%);
            color: white;
            border: none;
            padding: 20px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.3);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .btn.stop {
            background: linear-gradient(135deg, #ffa502 0%, #ff7f50 100%);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status-panel {
            background: var(--light);
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
            min-height: 120px;
            transition: all 0.3s ease;
        }
        
        .status-panel.success {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
        }
        
        .status-panel.error {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        }
        
        .status-panel.running {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }
        
        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stat .number {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--secondary);
            display: block;
        }
        
        .stat .label {
            color: #666;
            font-size: 0.9em;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2.2em;
            }
            
            .content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💣 SMS Бомбер</h1>
            <p>Рабочая версия с гарантированной доставкой SMS</p>
        </div>

        <div class="content">
            <div class="services-grid" id="servicesGrid">
                <!-- Services will be loaded here -->
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="phone">📱 Номер телефона:</label>
                    <input type="tel" id="phone" placeholder="79001234567 (11 цифр)" maxlength="11" required>
                </div>
                
                <div class="form-group">
                    <label for="duration">⏱️ Время работы:</label>
                    <select id="duration">
                        <option value="5">5 минут</option>
                        <option value="10" selected>10 минут</option>
                        <option value="15">15 минут</option>
                        <option value="30">30 минут</option>
                        <option value="60">60 минут</option>
                    </select>
                </div>
            </div>

            <button class="btn" id="actionBtn">
                🚀 Запустить Бомбер
            </button>

            <div class="status-panel" id="statusPanel">
                <div id="statusText">Готов к работе. Введите номер телефона.</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>

            <div class="stats-grid" id="statsGrid" style="display: none;">
                <div class="stat">
                    <span class="number" id="sentCount">0</span>
                    <span class="label">Отправлено SMS</span>
                </div>
                <div class="stat">
                    <span class="number" id="successCount">0</span>
                    <span class="label">Успешных</span>
                </div>
                <div class="stat">
                    <span class="number" id="timeLeft">0</span>
                    <span class="label">Минут осталось</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        class WorkingSMSBomber {
            constructor() {
                this.isRunning = false;
                this.currentPhone = '';
                this.statusInterval = null;
                this.init();
            }

            async init() {
                await this.loadServices();
                this.setupEventListeners();
                this.updateStatus('Готов к работе. Используется облачная автоматизация для гарантированной доставки SMS.', 'ready');
            }

            async loadServices() {
                try {
                    const response = await fetch('/api/services');
                    const data = await response.json();
                    
                    const servicesGrid = document.getElementById('servicesGrid');
                    servicesGrid.innerHTML = data.services.map(service => `
                        <div class="service-card ${service.status}">
                            <div class="icon">${this.getServiceIcon(service.name)}</div>
                            <div class="name">${service.name}</div>
                            <div class="type">${service.type}</div>
                        </div>
                    `).join('');
                } catch (error) {
                    console.error('Error loading services:', error);
                }
            }

            getServiceIcon(serviceName) {
                const icons = {
                    'WhatsApp': '💚',
                    'Telegram': '💙', 
                    'Avito': '🏪',
                    'Delivery Club': '🍕'
                };
                return icons[serviceName] || '📱';
            }

            setupEventListeners() {
                const actionBtn = document.getElementById('actionBtn');
                actionBtn.addEventListener('click', () => {
                    if (this.isRunning) {
                        this.stopBombing();
                    } else {
                        this.startBombing();
                    }
                });

                // Real-time phone validation
                document.getElementById('phone').addEventListener('input', (e) => {
                    const phone = e.target.value.replace(/\D/g, '');
                    e.target.value = phone.slice(0, 11);
                });
            }

            async startBombing() {
                const phone = document.getElementById('phone').value;
                const duration = document.getElementById('duration').value;

                if (!this.validatePhone(phone)) {
                    this.updateStatus('❌ Введите корректный номер телефона (ровно 11 цифр)', 'error');
                    return;
                }

                this.currentPhone = phone;
                this.updateStatus('🔄 Запускаем облачную автоматизацию...', 'running');
                document.getElementById('actionBtn').disabled = true;

                try {
                    const response = await fetch('/api/start-bombing', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            phone: phone,
                            duration: parseInt(duration)
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        this.isRunning = true;
                        document.getElementById('actionBtn').innerHTML = '🛑 Остановить Бомбер';
                        document.getElementById('actionBtn').classList.add('stop');
                        this.updateStatus(`✅ ${data.message}<br><small>Используется ${data.services} сервисов</small>`, 'success');
                        document.getElementById('statsGrid').style.display = 'grid';
                        this.startStatusUpdates();
                    } else {
                        throw new Error(data.error);
                    }
                } catch (error) {
                    this.updateStatus(`❌ Ошибка: ${error.message}`, 'error');
                } finally {
                    document.getElementById('actionBtn').disabled = false;
                }
            }

            async stopBombing() {
                this.updateStatus('🔄 Останавливаем бомбер...', 'running');
                document.getElementById('actionBtn').disabled = true;

                try {
                    const response = await fetch('/api/stop-bombing', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            phone: this.currentPhone
                        })
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        this.updateStatus(`🛑 ${data.message}<br>Итог: ${data.finalStats.successful} успешных отправок`, 'ready');
                    }
                } catch (error) {
                    this.updateStatus(`⚠️ Ошибка остановки: ${error.message}`, 'error');
                } finally {
                    this.resetUI();
                }
            }

            async startStatusUpdates() {
                this.statusInterval = setInterval(async () => {
                    if (!this.isRunning) return;

                    try {
                        const response = await fetch(`/api/status/${this.currentPhone}`);
                        const data = await response.json();

                        if (data.active) {
                            // Update stats
                            document.getElementById('sentCount').textContent = data.stats.totalAttempts;
                            document.getElementById('successCount').textContent = data.stats.successful;
                            document.getElementById('timeLeft').textContent = data.timeLeft;
                            
                            // Update progress
                            const totalTime = (data.timeLeft + (data.stats.totalAttempts / 2));
                            const progress = ((totalTime - data.timeLeft) / totalTime) * 100;
                            document.getElementById('progressFill').style.width = `${progress}%`;
                            
                            // Update status
                            this.updateStatus(
                                `🔵 Бомбер активен<br>` +
                                `<small>Отправлено: ${data.stats.successful}/${data.stats.totalAttempts} | Осталось: ${data.timeLeft} мин</small>`,
                                'running'
                            );
                        } else {
                            this.stopBombing();
                        }
                    } catch (error) {
                        console.error('Status update error:', error);
                    }
                }, 3000);
            }

            stopStatusUpdates() {
                if (this.statusInterval) {
                    clearInterval(this.statusInterval);
                    this.statusInterval = null;
                }
            }

            resetUI() {
                document.getElementById('actionBtn').innerHTML = '🚀 Запустить Бомбер';
                document.getElementById('actionBtn').classList.remove('stop');
                document.getElementById('actionBtn').disabled = false;
                document.getElementById('statsGrid').style.display = 'none';
                document.getElementById('progressFill').style.width = '0%';
                this.isRunning = false;
            }

            validatePhone(phone) {
                return /^[0-9]{11}$/.test(phone);
            }

            updateStatus(message, type) {
                const statusPanel = document.getElementById('statusPanel');
                const statusText = document.getElementById('statusText');
                
                statusText.innerHTML = message;
                statusPanel.className = `status-panel ${type}`;
            }
        }

        // Initialize application
        document.addEventListener('DOMContentLoaded', () => {
            new WorkingSMSBomber();
        });
    </script>
</body>
</html>
