<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Wylow Messenger BETA 1.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        :root {
            --primary: #7289da;
            --primary-hover: #677bc4;
            --background: #1a1a1a;
            --sidebar: #2d2d2d;
            --chat-area: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border: #404040;
            --success: #43b581;
            --danger: #f04747;
        }

        body {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Стили для экрана аутентификации */
        .auth-container {
            background: var(--sidebar);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
            color: var(--text-primary);
        }

        .auth-container h1 {
            margin-bottom: 10px;
            color: var(--primary);
        }

        .beta-badge {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 10px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            background: var(--background);
            border-radius: 8px;
            padding: 4px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .auth-tab.active {
            background: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .error-message {
            color: var(--danger);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* Стили мессенджера */
        .messenger-container {
            width: 95vw;
            height: 95vh;
            background: var(--background);
            border-radius: 20px;
            display: flex;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: none;
        }

        .sidebar {
            width: 350px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .profile-section {
            padding: 20px;
            background: var(--sidebar);
            border-bottom: 1px solid var(--border);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-primary);
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        .avatar-input {
            display: none;
        }

        .profile-info h3 {
            margin-bottom: 5px;
        }

        .profile-info span {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .search-container {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            background: var(--background);
            border: none;
            border-radius: 25px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-results {
            position: absolute;
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 5px;
            width: 320px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }

        .search-result-item {
            padding: 10px 15px;
            cursor: pointer;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
        }

        .search-result-item:hover {
            background: var(--background);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .chat-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.3s;
            border-bottom: 1px solid var(--border);
        }

        .chat-item:hover {
            background: var(--background);
        }

        .chat-item.active {
            background: var(--background);
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background-size: cover;
            background-position: center;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .last-message {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .new-group-btn {
            margin: 15px;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .new-group-btn:hover {
            background: var(--primary-hover);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-area);
        }

        .chat-header {
            padding: 20px;
            background: var(--sidebar);
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-actions {
            margin-left: auto;
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
        }

        .icon-btn:hover {
            color: var(--text-primary);
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: var(--background);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.own {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            color: var(--text-primary);
            position: relative;
        }

        .message.other .message-bubble {
            background: var(--sidebar);
            border-bottom-left-radius: 5px;
        }

        .message.own .message-bubble {
            background: var(--primary);
            border-bottom-right-radius: 5px;
        }

        .message-sender {
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 5px;
            padding-left: 10px;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 5px;
            text-align: right;
        }

        .input-area {
            padding: 20px;
            background: var(--sidebar);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 15px 20px;
            background: var(--background);
            border: none;
            border-radius: 25px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .send-btn {
            background: var(--primary);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--sidebar);
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            max-width: 90%;
            color: var(--text-primary);
        }

        .modal h3 {
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .group-members-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .member-item {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .member-item:last-child {
            border-bottom: none;
        }

        .member-checkbox {
            margin-right: 10px;
        }

        .no-chats-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <!-- Экран аутентификации -->
    <div class="auth-container" id="authContainer">
        <h1>Wylow <span class="beta-badge">BETA 1.0</span></h1>
        <p style="color: var(--text-secondary); margin-bottom: 20px;">Мессенджер нового поколения</p>
        
        <div class="auth-tabs">
            <div class="auth-tab active" id="loginTab">Вход</div>
            <div class="auth-tab" id="registerTab">Регистрация</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" class="form-control" id="loginUsername" required>
                <div class="error-message" id="loginUsernameError"></div>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" class="form-control" id="loginPassword" required>
                <div class="error-message" id="loginPasswordError"></div>
            </div>
            <button type="submit" class="btn-primary">Войти</button>
        </form>

        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" class="form-control" id="registerUsername" required>
                <div class="error-message" id="registerUsernameError"></div>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" class="form-control" id="registerPassword" required>
                <div class="error-message" id="registerPasswordError"></div>
            </div>
            <div class="form-group">
                <label>Подтверждение пароля</label>
                <input type="password" class="form-control" id="registerConfirmPassword" required>
                <div class="error-message" id="registerConfirmError"></div>
            </div>
            <button type="submit" class="btn-primary">Зарегистрироваться</button>
        </form>
    </div>

    <!-- Основной интерфейс мессенджера -->
    <div class="messenger-container" id="messengerContainer">
        <div class="sidebar">
            <div class="profile-section">
                <div class="profile-header">
                    <div class="avatar" id="userAvatar" onclick="document.getElementById('avatarInput').click()">
                        <input type="file" id="avatarInput" class="avatar-input" accept="image/*">
                    </div>
                    <div class="profile-info">
                        <h3 id="userName">Пользователь</h3>
                        <span id="userStatus">в сети</span>
                    </div>
                </div>
            </div>

            <div class="search-container">
                <input type="text" class="search-box" id="userSearch" placeholder="Поиск пользователей...">
                <div class="search-results" id="searchResults"></div>
            </div>

            <div class="chats-list" id="chatsList">
                <div class="no-chats-message" id="noChatsMessage">
                    Начните общение - найдите пользователя выше
                </div>
            </div>

            <button class="new-group-btn" onclick="openNewGroupModal()">+ Новая группа</button>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-avatar" id="currentChatAvatar">W</div>
                <div class="chat-info">
                    <div class="chat-name" id="currentChatName">Выберите чат</div>
                    <div class="last-message" id="currentChatStatus">Начните общение</div>
                </div>
                <div class="chat-actions">
                    <button class="icon-btn" onclick="showChatInfo()">⚙️</button>
                </div>
            </div>

            <div class="messages-container" id="messagesArea">
                <div class="no-chats-message">
                    Выберите чат для начала общения
                </div>
            </div>

            <div class="input-area">
                <input type="text" class="message-input" id="messageInput" placeholder="Введите сообщение..." disabled>
                <button class="send-btn" onclick="sendMessage()" disabled>➤</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно новой группы -->
    <div class="modal" id="newGroupModal">
        <div class="modal-content">
            <h3>Создать новую группу</h3>
            <div class="form-group">
                <label>Название группы</label>
                <input type="text" class="form-control" id="newGroupName" placeholder="Введите название группы">
            </div>
            <div class="form-group">
                <label>Выберите участников:</label>
                <div class="group-members-list" id="groupMembersList">
                    <!-- Список контактов будет здесь -->
                </div>
            </div>
            <button class="btn-primary" onclick="createNewGroup()">Создать группу</button>
        </div>
    </div>

    <script>
        // База данных в localStorage
        const DB = {
            users: 'wylow_users',
            chats: 'wylow_chats',
            currentUser: 'wylow_current_user',
            messages: 'wylow_messages'
        };

        let currentUser = null;
        let currentChat = null;
        let allUsers = [];
        let userChats = [];

        // Инициализация при загрузке
        function initialize() {
            loadAllUsers();
            checkAuthStatus();
            setupEventListeners();
        }

        // Загрузка всех пользователей
        function loadAllUsers() {
            const users = localStorage.getItem(DB.users);
            allUsers = users ? JSON.parse(users) : [];
        }

        // Сохранение пользователей
        function saveAllUsers() {
            localStorage.setItem(DB.users, JSON.stringify(allUsers));
        }

        // Проверка статуса аутентификации
        function checkAuthStatus() {
            const savedUser = localStorage.getItem(DB.currentUser);
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showMessenger();
            } else {
                showAuth();
            }
        }

        // Показать экран аутентификации
        function showAuth() {
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('messengerContainer').style.display = 'none';
        }

        // Показать мессенджер
        function showMessenger() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('messengerContainer').style.display = 'flex';
            updateUserInterface();
            loadUserChats();
        }

        // Настройка обработчиков событий
        function setupEventListeners() {
            // Переключение между вкладками входа и регистрации
            document.getElementById('loginTab').addEventListener('click', () => switchAuthTab('login'));
            document.getElementById('registerTab').addEventListener('click', () => switchAuthTab('register'));

            // Формы аутентификации
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('registerForm').addEventListener('submit', handleRegister);

            // Поиск пользователей
            document.getElementById('userSearch').addEventListener('input', handleUserSearch);
            document.getElementById('avatarInput').addEventListener('change', handleAvatarUpload);

            // Отправка сообщения по Enter
            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        }

        // Переключение вкладок аутентификации
        function switchAuthTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginTab.classList.remove('active');
                registerTab.classList.add('active');
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        // Обработка входа
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            hideAllErrors();

            const user = allUsers.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = user;
                localStorage.setItem(DB.currentUser, JSON.stringify(user));
                showMessenger();
            } else {
                showError('loginPasswordError', 'Неверный логин или пароль');
            }
        }

        // Обработка регистрации
        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            hideAllErrors();

            if (allUsers.find(u => u.username === username)) {
                showError('registerUsernameError', 'Пользователь с таким логином уже существует');
                return;
            }

            if (password !== confirmPassword) {
                showError('registerConfirmError', 'Пароли не совпадают');
                return;
            }

            if (password.length < 6) {
                showError('registerPasswordError', 'Пароль должен быть не менее 6 символов');
                return;
            }

            const newUser = {
                id: 'user_' + Date.now(),
                username: username,
                password: password,
                avatar: '',
                status: 'в сети',
                createdAt: new Date().toISOString()
            };

            allUsers.push(newUser);
            saveAllUsers();

            currentUser = newUser;
            localStorage.setItem(DB.currentUser, JSON.stringify(newUser));
            showMessenger();
        }

        // Поиск пользователей
        function handleUserSearch(e) {
            const query = e.target.value.toLowerCase();
            const resultsContainer = document.getElementById('searchResults');

            if (query.length < 2) {
                resultsContainer.style.display = 'none';
                return;
            }

            const filteredUsers = allUsers.filter(user => 
                user.username.toLowerCase().includes(query) && 
                user.id !== currentUser.id
            );

            if (filteredUsers.length > 0) {
                resultsContainer.innerHTML = filteredUsers.map(user => `
                    <div class="search-result-item" onclick="startChatWithUser('${user.id}')">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div class="chat-avatar" style="background-image: url(${user.avatar})">${user.avatar ? '' : user.username.charAt(0).toUpperCase()}</div>
                            <div>${user.username}</div>
                        </div>
                    </div>
                `).join('');
                resultsContainer.style.display = 'block';
            } else {
                resultsContainer.innerHTML = '<div class="search-result-item">Пользователи не найдены</div>';
                resultsContainer.style.display = 'block';
            }
        }

        // Начать чат с пользователем
        function startChatWithUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            document.getElementById('userSearch').value = '';
            document.getElementById('searchResults').style.display = 'none';

            // Проверяем, есть ли уже чат с этим пользователем
            let chat = userChats.find(c => 
                c.type === 'private' && 
                c.participants.includes(userId)
            );

            if (!chat) {
                // Создаем новый чат
                chat = {
                    id: 'chat_' + Date.now(),
                    type: 'private',
                    name: user.username,
                    participants: [currentUser.id, userId],
                    avatar: user.avatar,
                    lastMessage: '',
                    lastMessageTime: new Date().toISOString(),
                    messages: []
                };
                userChats.push(chat);
                saveUserChats();
            }

            openChat(chat.id);
        }

        // Загрузка чатов пользователя
        function loadUserChats() {
            const chats = localStorage.getItem(DB.chats);
            userChats = chats ? JSON.parse(chats) : [];
            userChats = userChats.filter(chat => chat.participants.includes(currentUser.id));
            renderChatsList();
        }

        // Сохранение чатов
        function saveUserChats() {
            localStorage.setItem(DB.chats, JSON.stringify(userChats));
        }

        // Отображение списка чатов
        function renderChatsList() {
            const chatsList = document.getElementById('chatsList');
            const noChatsMessage = document.getElementById('noChatsMessage');

            if (userChats.length === 0) {
                noChatsMessage.style.display = 'block';
                chatsList.innerHTML = '';
                return;
            }

            noChatsMessage.style.display = 'none';

            // Сортируем чаты по времени последнего сообщения
            userChats.sort((a, b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime));

            chatsList.innerHTML = userChats.map(chat => `
                <div class="chat-item ${currentChat === chat.id ? 'active' : ''}" onclick="openChat('${chat.id}')">
                    <div class="chat-avatar" style="background-image: url(${chat.avatar})">
                        ${chat.avatar ? '' : chat.name.charAt(0).toUpperCase()}
                    </div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name}</div>
                        <div class="last-message">${chat.lastMessage || 'Нет сообщений'}</div>
                    </div>
                </div>
            `).join('');
        }

        // Открытие чата
        function openChat(chatId) {
            currentChat = chatId;
            const chat = userChats.find(c => c.id === chatId);
            
            if (!chat) return;

            document.getElementById('currentChatName').textContent = chat.name;
            document.getElementById('currentChatAvatar').textContent = chat.avatar ? '' : chat.name.charAt(0).toUpperCase();
            document.getElementById('currentChatAvatar').style.backgroundImage = chat.avatar ? `url(${chat.avatar})` : '';
            document.getElementById('currentChatStatus').textContent = 
                chat.type === 'group' ? `${chat.participants.length} участников` : 'в сети';

            document.getElementById('messageInput').disabled = false;
            document.querySelector('.send-btn').disabled = false;

            loadMessages(chat.messages);
            renderChatsList();
        }

        // Загрузка сообщений
        function loadMessages(messages) {
            const messagesArea = document.getElementById('messagesArea');
            
            if (messages.length === 0) {
                messagesArea.innerHTML = '<div class="no-chats-message">Нет сообщений</div>';
                return;
            }

            messagesArea.innerHTML = messages.map(msg => {
                const isOwn = msg.senderId === currentUser.id;
                const sender = allUsers.find(u => u.id === msg.senderId);
                return `
                    <div class="message ${isOwn ? 'own' : 'other'}">
                        ${!isOwn ? `<div class="message-sender">${sender ? sender.username : 'Неизвестный'}</div>` : ''}
                        <div class="message-bubble">${msg.text}</div>
                        <div class="message-time">${formatTime(msg.time)}</div>
                    </div>
                `;
            }).join('');

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Отправка сообщения
        function sendMessage() {
            if (!currentChat) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;

            const chatIndex = userChats.findIndex(c => c.id === currentChat);
            if (chatIndex === -1) return;

            const newMessage = {
                id: 'msg_' + Date.now(),
                text: text,
                senderId: currentUser.id,
                time: new Date().toISOString()
            };

            userChats[chatIndex].messages.push(newMessage);
            userChats[chatIndex].lastMessage = text;
            userChats[chatIndex].lastMessageTime = new Date().toISOString();

            saveUserChats();
            
            input.value = '';
            loadMessages(userChats[chatIndex].messages);
            renderChatsList();
        }

        // Создание новой группы
        function openNewGroupModal() {
            // Получаем список пользователей, с которыми есть чаты
            const contactUserIds = new Set();
            userChats.forEach(chat => {
                if (chat.type === 'private') {
                    chat.participants.forEach(id => {
                        if (id !== currentUser.id) contactUserIds.add(id);
                    });
                }
            });

            const contacts = allUsers.filter(user => contactUserIds.has(user.id));
            
            document.getElementById('groupMembersList').innerHTML = contacts.map(user => `
                <div class="member-item">
                    <input type="checkbox" class="member-checkbox" value="${user.id}">
                    <div class="chat-avatar" style="background-image: url(${user.avatar})">${user.avatar ? '' : user.username.charAt(0).toUpperCase()}</div>
                    <div>${user.username}</div>
                </div>
            `).join('');

            document.getElementById('newGroupModal').style.display = 'flex';
        }

        function createNewGroup() {
            const groupName = document.getElementById('newGroupName').value;
            if (!groupName) {
                alert('Введите название группы');
                return;
            }

            const selectedMembers = Array.from(document.querySelectorAll('.member-checkbox:checked'))
                .map(checkbox => checkbox.value);

            if (selectedMembers.length === 0) {
                alert('Выберите хотя бы одного участника');
                return;
            }

            const newGroup = {
                id: 'chat_' + Date.now(),
                type: 'group',
                name: groupName,
                participants: [currentUser.id, ...selectedMembers],
                avatar: '',
                lastMessage: '',
                lastMessageTime: new Date().toISOString(),
                messages: []
            };

            userChats.push(newGroup);
            saveUserChats();
            
            document.getElementById('newGroupModal').style.display = 'none';
            document.getElementById('newGroupName').value = '';
            renderChatsList();
            openChat(newGroup.id);
        }

        // Загрузка аватарки
        function handleAvatarUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentUser.avatar = e.target.result;
                localStorage.setItem(DB.currentUser, JSON.stringify(currentUser));
                
                // Обновляем аватарку в списке пользователей
                const userIndex = allUsers.findIndex(u => u.id === currentUser.id);
                if (userIndex !== -1) {
                    allUsers[userIndex].avatar = e.target.result;
                    saveAllUsers();
                }

                updateUserInterface();
            };
            reader.readAsDataURL(file);
        }

        // Обновление интерфейса пользователя
        function updateUserInterface() {
            if (!currentUser) return;

            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userStatus').textContent = currentUser.status;
            
            const avatarElement = document.getElementById('userAvatar');
            if (currentUser.avatar) {
                avatarElement.style.backgroundImage = `url(${currentUser.avatar})`;
                avatarElement.textContent = '';
            } else {
                avatarElement.style.backgroundImage = '';
                avatarElement.textContent = currentUser.username.charAt(0).toUpperCase();
            }
        }

        // Вспомогательные функции
        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('ru-RU', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function showChatInfo() {
            if (!currentChat) return;
            
            const chat = userChats.find(c => c.id === currentChat);
            if (chat) {
                const participantNames = chat.participants
                    .map(id => allUsers.find(u => u.id === id)?.username || 'Неизвестный')
                    .join(', ');
                
                alert(`Информация о чате:\nНазвание: ${chat.name}\nТип: ${chat.type === 'group' ? 'Групповой' : 'Личный'}\nУчастники: ${participantNames}\nСообщений: ${chat.messages.length}`);
            }
        }

        function hideAllErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        // Выход из системы
        function logout() {
            localStorage.removeItem(DB.currentUser);
            currentUser = null;
            currentChat = null;
            showAuth();
        }

        // Инициализация при загрузке
        window.onload = initialize;
    </script>
</body>
</html>
