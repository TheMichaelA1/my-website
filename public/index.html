<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бомбер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #764ba2;
        }

        button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background: #667eea;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.stop {
            background: #dc3545;
        }

        button.stop:hover {
            background: #c82333;
        }

        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            background: #f8f9fa;
            color: #333;
            font-weight: bold;
            min-height: 60px;
        }

        .stats {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Бомбер</h1>
        <div class="input-group">
            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" placeholder="+79991234567" required>
        </div>
        <div class="input-group">
            <label for="minutes">Минут работы:</label>
            <input type="number" id="minutes" placeholder="Введите количество минут" min="1" max="60" required>
        </div>
        <button id="actionButton">Запустить бомбер</button>
        <div id="status" class="status">Готов к работе</div>
        <div id="stats" class="stats"></div>
    </div>

    <script>
        let isRunning = false;
        let stopRequested = false;

        document.getElementById('actionButton').addEventListener('click', async function() {
            const phone = document.getElementById('phone').value;
            const minutes = document.getElementById('minutes').value;
            const statusDiv = document.getElementById('status');
            const statsDiv = document.getElementById('stats');
            const button = this;

            if (!phone || !minutes) {
                statusDiv.textContent = 'Ошибка: Заполните все поля!';
                statusDiv.style.color = 'red';
                return;
            }

            if (!isRunning) {
                // Запуск бомбера
                button.textContent = 'Остановить бомбер';
                button.classList.add('stop');
                statusDiv.textContent = `Запуск бомбера на номер ${phone}...`;
                statusDiv.style.color = 'green';
                isRunning = true;
                stopRequested = false;

                try {
                    const response = await fetch('/start-bomber', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ phone, minutes })
                    });

                    const result = await response.json();
                    
                    if (result.success) {
                        statusDiv.textContent = result.message;
                        statsDiv.textContent = `Примерное количество сообщений: ${result.estimatedMessages}`;
                        
                        // Таймер обратного отсчета
                        let timeLeft = minutes * 60;
                        const countdown = setInterval(() => {
                            if (stopRequested || timeLeft <= 0) {
                                clearInterval(countdown);
                                return;
                            }
                            timeLeft--;
                            const mins = Math.floor(timeLeft / 60);
                            const secs = timeLeft % 60;
                            statsDiv.textContent = `Осталось времени: ${mins}:${secs < 10 ? '0' : ''}${secs} | Сообщений отправлено: ${Math.floor((minutes * 60 - timeLeft) / 10) * result.estimatedMessages / (minutes * 6)}`;
                        }, 1000);

                    } else {
                        throw new Error(result.error);
                    }

                } catch (error) {
                    statusDiv.textContent = `Ошибка: ${error.message}`;
                    statusDiv.style.color = 'red';
                    button.textContent = 'Запустить бомбер';
                    button.classList.remove('stop');
                    isRunning = false;
                }

            } else {
                // Остановка бомбера
                stopRequested = true;
                button.disabled = true;
                statusDiv.textContent = 'Останавливаем бомбер...';
                
                try {
                    await fetch('/stop-bomber', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });
                    
                    statusDiv.textContent = `Рассылка на номер ${phone} остановлена.`;
                    statusDiv.style.color = 'orange';
                    
                } catch (error) {
                    statusDiv.textContent = `Ошибка при остановке: ${error.message}`;
                    statusDiv.style.color = 'red';
                }
                
                button.textContent = 'Запустить бомбер';
                button.classList.remove('stop');
                button.disabled = false;
                isRunning = false;
                statsDiv.textContent = '';
            }
        });
    </script>
</body>
</html>
