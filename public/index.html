<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MichaelASeek - Продвинутая нейросеть</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --dark: #1f2937;
            --light: #f8fafc;
            --gray: #6b7280;
            --border: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Auth Modal */
        .auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .auth-logo {
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .auth-subtitle {
            color: var(--gray);
            margin-bottom: 30px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            border-radius: 12px;
            background: var(--light);
            padding: 4px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .error {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--dark);
            color: white;
            padding: 20px;
            display: none;
        }

        .sidebar.active {
            display: block;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .sidebar-logo {
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-chat-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            width: 100%;
            transition: all 0.3s;
        }

        .new-chat-btn:hover {
            background: var(--primary-dark);
        }

        .chats-list {
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }

        .chat-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .chat-item:hover {
            background: rgba(255,255,255,0.2);
        }

        .chat-item.active {
            background: var(--primary);
        }

        .chat-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .chat-preview {
            font-size: 12px;
            opacity: 0.7;
        }

        .delete-chat {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            float: right;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: none;
            flex-direction: column;
            background: white;
        }

        .main-content.active {
            display: flex;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title-main {
            font-size: 1.5em;
            font-weight: bold;
        }

        .support-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .support-btn:hover {
            background: #059669;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }

        .message {
            margin-bottom: 20px;
            max-width: 80%;
        }

        .message.user {
            margin-left: auto;
        }

        .message.assistant {
            margin-right: auto;
        }

        .message-bubble {
            padding: 15px 20px;
            border-radius: 18px;
            position: relative;
        }

        .message.user .message-bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: var(--light);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .image-result {
            background: #f3f4f6;
            border: 2px dashed #d1d5db;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-family: monospace;
            white-space: pre-wrap;
            margin: 10px 0;
        }

        .chat-input-container {
            padding: 20px;
            border-top: 1px solid var(--border);
        }

        .chat-input-form {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            height: 60px;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .send-btn:hover {
            background: var(--primary-dark);
        }

        .user-info {
            color: var(--gray);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -100%;
                transition: left 0.3s;
                z-index: 100;
                height: 100vh;
            }
            
            .sidebar.active {
                left: 0;
            }
            
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Modal -->
    <div id="authModal" class="auth-modal">
        <div class="auth-content">
            <div class="auth-logo">MichaelASeek</div>
            <div class="auth-subtitle">Продвинутая нейросеть 1.0</div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showAuthForm('login')">Вход</button>
                <button class="auth-tab" onclick="showAuthForm('register')">Регистрация</button>
            </div>
            
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginUsername">Логин</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Войти</button>
                <div id="loginError" class="error"></div>
            </form>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="registerUsername">Логин</label>
                    <input type="text" id="registerUsername" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Пароль</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                <div id="registerError" class="error"></div>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div class="container">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">MichaelASeek</div>
            </div>
            
            <button class="new-chat-btn" onclick="createNewChat()">+ Новый чат</button>
            
            <div class="chats-list" id="chatsList">
                <!-- Chats will be loaded here -->
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent" class="main-content">
            <div class="chat-header">
                <div class="chat-title-main" id="currentChatTitle">Новый чат</div>
                <div>
                    <span class="user-info" id="userInfo"></span>
                    <button class="support-btn" onclick="openSupport()">Поддержка</button>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-bubble">
                        Привет! Я MichaelASeek 1.0 - продвинутая нейросеть. Чем могу помочь?
                    </div>
                    <div class="message-time" id="welcomeTime"></div>
                </div>
            </div>
            
            <div class="chat-input-container">
                <form class="chat-input-form" id="chatForm">
                    <textarea class="chat-input" id="chatInput" placeholder="Введите ваше сообщение..." required></textarea>
                    <button type="submit" class="send-btn">Отправить</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentChatId = null;
        let currentToken = null;

        // Auth functions
        function showAuthForm(formType) {
            document.querySelectorAll('.auth-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(formType + 'Form').classList.add('active');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentUser = data.username;
                    currentToken = data.token;
                    localStorage.setItem('michaelaseek_token', data.token);
                    localStorage.setItem('michaelaseek_user', data.username);
                    showApp();
                    loadChats();
                } else {
                    document.getElementById('loginError').textContent = data.error;
                }
            } catch (error) {
                document.getElementById('loginError').textContent = 'Ошибка соединения';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentUser = data.username;
                    currentToken = data.token;
                    localStorage.setItem('michaelaseek_token', data.token);
                    localStorage.setItem('michaelaseek_user', data.username);
                    showApp();
                    loadChats();
                } else {
                    document.getElementById('registerError').textContent = data.error;
                }
            } catch (error) {
                document.getElementById('registerError').textContent = 'Ошибка соединения';
            }
        });

        // App functions
        function showApp() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('sidebar').classList.add('active');
            document.getElementById('mainContent').classList.add('active');
            document.getElementById('userInfo').textContent = currentUser;
            document.getElementById('welcomeTime').textContent = new Date().toLocaleTimeString('ru-RU');
        }

        async function loadChats() {
            try {
                const response = await fetch('/api/chats', {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
                
                const data = await response.json();
                renderChats(data.chats);
                
                if (data.chats.length > 0 && !currentChatId) {
                    currentChatId = data.chats[0].id;
                    loadChat(currentChatId);
                }
            } catch (error) {
                console.error('Error loading chats:', error);
            }
        }

        function renderChats(chats) {
            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = '';
            
            chats.forEach(chat => {
                const chatElement = document.createElement('div');
                chatElement.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                chatElement.innerHTML = `
                    <div class="chat-title">${chat.title}</div>
                    <div class="chat-preview">${chat.messages[0]?.content.substring(0, 30) || 'Нет сообщений'}...</div>
                    <button class="delete-chat" onclick="deleteChat('${chat.id}')">×</button>
                `;
                chatElement.onclick = () => loadChat(chat.id);
                chatsList.appendChild(chatElement);
            });
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            const chat = getCurrentChat();
            if (chat) {
                document.getElementById('currentChatTitle').textContent = chat.title;
                renderMessages(chat.messages);
            }
            loadChats(); // Refresh chat list to update active state
        }

        function getCurrentChat() {
            // This would normally come from the server
            // For demo, we'll use the first chat
            return { messages: [] };
        }

        function renderMessages(messages) {
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.innerHTML = '';
            
            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="message assistant">
                        <div class="message-bubble">
                            Привет! Я MichaelASeek 1.0 - продвинутая нейросеть. Чем могу помочь?
                        </div>
                        <div class="message-time">${new Date().toLocaleTimeString('ru-RU')}</div>
                    </div>
                `;
                return;
            }
            
            messages.forEach(msg => {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${msg.role}`;
                
                let content = msg.content;
                if (content.includes('🖼️ ГЕНЕРАЦИЯ_ИЗОБРАЖЕНИЯ:')) {
                    const imagePrompt = content.replace('🖼️ ГЕНЕРАЦИЯ_ИЗОБРАЖЕНИЯ:', '').trim();
                    content = `
                        <div class="image-result">
                            🎨 Сгенерировано изображение по запросу: "${imagePrompt}"
                            <br><br>
                            ════════════════════════════
                            <br>
                            🖼️ ИЗОБРАЖЕНИЕ: ${imagePrompt}
                            <br>
                            ════════════════════════════
                            <br><br>
                            <em>В реальном приложении здесь было бы сгенерированное изображение</em>
                        </div>
                    `;
                }
                
                messageElement.innerHTML = `
                    <div class="message-bubble">${content}</div>
                    <div class="message-time">${new Date(msg.timestamp).toLocaleTimeString('ru-RU')}</div>
                `;
                messagesContainer.appendChild(messageElement);
            });
            
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function createNewChat() {
            try {
                const response = await fetch('/api/chats/new', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                currentChatId = data.chat.id;
                loadChats();
                renderMessages([]);
            } catch (error) {
                console.error('Error creating chat:', error);
            }
        }

        async function deleteChat(chatId) {
            if (!confirm('Удалить этот чат?')) return;
            
            try {
                const response = await fetch(`/api/chats/${chatId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
                
                const data = await response.json();
                loadChats();
                
                if (currentChatId === chatId) {
                    currentChatId = null;
                    if (data.chats.length > 0) {
                        loadChat(data.chats[0].id);
                    } else {
                        createNewChat();
                    }
                }
            } catch (error) {
                console.error('Error deleting chat:', error);
            }
        }

        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message to UI immediately
            const messagesContainer = document.getElementById('chatMessages');
            const userMessageElement = document.createElement('div');
            userMessageElement.className = 'message user';
            userMessageElement.innerHTML = `
                <div class="message-bubble">${message}</div>
                <div class="message-time">${new Date().toLocaleTimeString('ru-RU')}</div>
            `;
            messagesContainer.appendChild(userMessageElement);
            
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        chatId: currentChatId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Add AI response to UI
                    const aiMessageElement = document.createElement('div');
                    aiMessageElement.className = 'message assistant';
                    
                    let content = data.response;
                    if (content.includes('🖼️ ГЕНЕРАЦИЯ_ИЗОБРАЖЕНИЯ:')) {
                        const imagePrompt = content.replace('🖼️ ГЕНЕРАЦИЯ_ИЗОБРАЖЕНИЯ:', '').trim();
                        content = `
                            <div class="image-result">
                                🎨 Сгенерировано изображение по запросу: "${imagePrompt}"
                                <br><br>
                                ════════════════════════════
                                <br>
                                🖼️ ИЗОБРАЖЕНИЕ: ${imagePrompt}
                                <br>
                                ════════════════════════════
                                <br><br>
                                <em>В реальном приложении здесь было бы сгенерированное изображение</em>
                            </div>
                        `;
                    }
                    
                    aiMessageElement.innerHTML = `
                        <div class="message-bubble">${content}</div>
                        <div class="message-time">${new Date().toLocaleTimeString('ru-RU')}</div>
                    `;
                    messagesContainer.appendChild(aiMessageElement);
                    
                    // Update chats list
                    loadChats();
                    
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } catch (error) {
                console.error('Error sending message:', error);
            }
        });

        function openSupport() {
            window.open('https://t.me/MichaelA5', '_blank');
        }

        // Check if user is already logged in
        window.addEventListener('load', () => {
            const savedToken = localStorage.getItem('michaelaseek_token');
            const savedUser = localStorage.getItem('michaelaseek_user');
            
            if (savedToken && savedUser) {
                currentToken = savedToken;
                currentUser = savedUser;
                showApp();
                loadChats();
            }
        });
    </script>
</body>
</html>
