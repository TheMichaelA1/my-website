<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Бомбер</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; 
            padding: 20px;
            min-height: 100vh;
        }
        .container { 
            max-width: 500px; 
            margin: 20px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { 
            text-align: center; 
            color: #d32f2f; 
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .input-group { 
            margin: 20px 0; 
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 5px 0; 
            border: 2px solid #ddd; 
            background: white; 
            color: #333; 
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #764ba2;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background: #d32f2f; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #b71c1c;
            transform: translateY(-2px);
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed;
            transform: none;
        }
        .status { 
            margin: 20px 0; 
            padding: 15px; 
            border-radius: 8px; 
            background: #f5f5f5;
            min-height: 80px;
        }
        .success { color: #4CAF50; }
        .error { color: #d32f2f; }
        .info { color: #2196F3; }
        .services {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .service-list {
            font-size: 14px;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💣 SMS Бомбер</h1>
        <div class="subtitle">Массовая отправка SMS на указанный номер</div>
        
        <div class="services">
            <strong>Рабочие сервисы:</strong>
            <div class="service-list" id="servicesList">Загрузка...</div>
        </div>

        <div class="input-group">
            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" placeholder="79015559460 (без +7)" required>
        </div>
        <div class="input-group">
            <label for="minutes">Время работы (минут):</label>
            <input type="number" id="minutes" placeholder="10" min="1" max="60" required value="10">
        </div>
        
        <button id="actionButton">🚀 Запустить бомбер</button>
        
        <div id="status" class="status">
            Готов к работе. Введите номер и время.
        </div>
    </div>

    <script>
        // Загрузка списка сервисов
        fetch('/status')
            .then(r => r.json())
            .then(data => {
                document.getElementById('servicesList').textContent = data.services.join(', ');
            });

        document.getElementById('actionButton').addEventListener('click', async function() {
            const phone = document.getElementById('phone').value;
            const minutes = document.getElementById('minutes').value;
            const statusDiv = document.getElementById('status');
            const button = this;

            if (!phone || !phone.match(/^[0-9]{11}$/)) {
                statusDiv.innerHTML = '<span class="error">Введите корректный номер (11 цифр без +7)</span>';
                return;
            }

            if (!minutes || minutes < 1 || minutes > 60) {
                statusDiv.innerHTML = '<span class="error">Введите время от 1 до 60 минут</span>';
                return;
            }

            if (button.textContent.includes('Запустить')) {
                button.textContent = '⏳ Запускаем...';
                button.disabled = true;
                statusDiv.innerHTML = '<span class="info">Инициализация бомбера...</span>';

                try {
                    const response = await fetch('/start-bomber', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone, minutes })
                    });

                    const result = await response.json();
                    
                    if (result.success) {
                        button.textContent = '🛑 Остановить бомбер';
                        button.disabled = false;
                        statusDiv.innerHTML = `
                            <span class="success">${result.message}</span><br>
                            <small><strong>${result.firstCycle}</strong></small><br>
                            <small>Сервисов: ${result.totalServices} | ${result.nextCycle}</small><br>
                            <small><em>${result.note}</em></small>
                        `;
                    } else {
                        throw new Error(result.error);
                    }

                } catch (error) {
                    statusDiv.innerHTML = `<span class="error">Ошибка: ${error.message}</span>`;
                    button.textContent = '🚀 Запустить бомбер';
                    button.disabled = false;
                }

            } else {
                button.textContent = '⏳ Останавливаем...';
                button.disabled = true;

                try {
                    const response = await fetch('/stop-bomber', { method: 'POST' });
                    const result = await response.json();
                    
                    statusDiv.innerHTML = `<span class="info">${result.message}</span>`;
                } catch (error) {
                    statusDiv.innerHTML = `<span class="error">Ошибка: ${error.message}</span>`;
                }
                
                button.textContent = '🚀 Запустить бомбер';
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
