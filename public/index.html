        // FIXED: Better API call with detailed error handling
        async function apiCall(endpoint, options = {}) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                console.log(`API Call: ${endpoint}`, options.body || '');
                
                const response = await fetch(API_BASE + endpoint, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...(authToken && { 'Authorization': 'Bearer ' + authToken }),
                        ...options.headers
                    },
                    signal: controller.signal,
                    ...options
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`HTTP ${response.status}: ${errorText}`);
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log(`API Response:`, data);
                return data;
                
            } catch (error) {
                clearTimeout(timeoutId);
                console.error('API call failed:', error);
                
                if (error.name === 'AbortError') {
                    return { success: false, error: 'Таймаут соединения (15 сек)' };
                }
                
                if (error.message.includes('Failed to fetch')) {
                    return { success: false, error: 'Не удалось подключиться к серверу' };
                }
                
                return { success: false, error: 'Ошибка сети: ' + error.message };
            }
        }

        // FIXED: Better session management
        function loadSession() {
            try {
                const savedToken = localStorage.getItem(TOKEN_KEY);
                const savedUser = localStorage.getItem(USER_KEY);
                
                if (savedToken && savedUser) {
                    authToken = savedToken;
                    currentUser = JSON.parse(savedUser);
                    console.log('Session loaded:', currentUser.login);
                    return true;
                }
            } catch (e) {
                console.error('Error loading session:', e);
                clearSession();
            }
            return false;
        }

        function saveSession() {
            try {
                if (authToken && currentUser) {
                    localStorage.setItem(TOKEN_KEY, authToken);
                    localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
                }
            } catch (e) {
                console.error('Error saving session:', e);
            }
        }

        function clearSession() {
            try {
                localStorage.removeItem(TOKEN_KEY);
                localStorage.removeItem(USER_KEY);
            } catch (e) {
                console.error('Error clearing session:', e);
            }
            currentUser = null;
            authToken = null;
        }

        // FIXED: Better notification system
        function showNotification(message, isError = false) {
            try {
                const notification = document.createElement('div');
                notification.className = `notification ${isError ? 'error-notification' : ''}`;
                notification.textContent = message;
                notification.style.background = isError ? '#ff4444' : '#00c853';
                notification.style.zIndex = '10000';
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 5000);
            } catch (e) {
                console.error('Error showing notification:', e);
                alert(message); // Fallback
            }
        }

        // FIXED: Better loading states
        function setLoading(button, isLoading) {
            if (!button) return;
            
            if (isLoading) {
                button.classList.add('loading');
                button.disabled = true;
                const originalText = button.innerHTML;
                button.setAttribute('data-original-text', originalText);
                button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Загрузка...';
            } else {
                button.classList.remove('loading');
                button.disabled = false;
                const originalText = button.getAttribute('data-original-text');
                if (originalText) {
                    button.innerHTML = originalText;
                }
            }
        }

        // FIXED: Better registration with validation
        async function register() {
            const login = document.getElementById('regLogin')?.value.trim() || '';
            const password = document.getElementById('regPassword')?.value || '';
            const email = document.getElementById('regEmail')?.value.trim() || '';
            const button = document.getElementById('registerBtn');
            
            if (!login || !password || !email) {
                showNotification('Заполните все поля', true);
                return;
            }
            
            if (password.length < 6) {
                showNotification('Пароль должен быть от 6 символов', true);
                return;
            }
            
            if (!validateEmail(email)) {
                showNotification('Введите корректный email', true);
                return;
            }
            
            setLoading(button, true);

            try {
                const result = await apiCall('/register', {
                    method: 'POST',
                    body: JSON.stringify({

                        email: email 
                    })
                });

                if (result.success) {

                    document.getElementById('mainInterface').classList.remove('hidden');

                console.error('Registration error:', error);
            } finally {
                setLoading(button, false);
            }
        }

        // FIXED: Better login with validation

        // FIXED: Server status check
        async function checkServerStatus() {

            } catch (error) {
                document.getElementById('serverStatus').textContent = 'Offline';

        // Utility function
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
