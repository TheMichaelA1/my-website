<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Wylow Messenger BETA 1.0</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --background: #0f0f23;
            --sidebar: #1a1a2e;
            --chat-area: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border: #2d3748;
            --success: #10b981;
            --danger: #ef4444;
            --accent: #06b6d4;
        }

        body {
            background: linear-gradient(135deg, #0f0f23, #1a1a2e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Стили для экрана аутентификации */
        .auth-container {
            background: var(--sidebar);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
            color: var(--text-primary);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .auth-container h1 {
            margin-bottom: 10px;
            color: var(--primary);
            font-size: 2.5em;
            font-weight: 300;
        }

        .beta-badge {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            margin-left: 10px;
            font-weight: 600;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            background: var(--background);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .auth-tab.active {
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .error-message {
            color: var(--danger);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* Стили мессенджера */
        .messenger-container {
            width: 95vw;
            height: 95vh;
            background: var(--background);
            border-radius: 25px;
            display: flex;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            display: none;
            border: 1px solid var(--border);
        }

        .sidebar {
            width: 380px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .profile-section {
            padding: 25px;
            background: rgba(26, 26, 46, 0.8);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-primary);
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--primary);
            transition: all 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .avatar-input {
            display: none;
        }

        .profile-info {
            flex: 1;
        }

        .profile-info h3 {
            margin-bottom: 5px;
            font-weight: 600;
        }

        .profile-info span {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .profile-btn {
            padding: 8px 16px;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .profile-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .search-container {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 14px 45px 14px 16px;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-results {
            position: absolute;
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 8px;
            width: calc(100% - 40px);
            max-height: 250px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .search-result-item {
            padding: 12px 16px;
            cursor: pointer;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-result-item:hover {
            background: var(--background);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .chat-item {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .chat-item:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .chat-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-left: 4px solid var(--primary);
        }

        .chat-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            transition: width 0.3s ease;
        }

        .chat-item:hover::before {
            width: 100%;
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .chat-item:hover .chat-avatar {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .chat-info {
            flex: 1;
            position: relative;
            z-index: 2;
        }

        .chat-name {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .last-message {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .new-group-btn {
            margin: 20px;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .new-group-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-area);
            position: relative;
        }

        .chat-header {
            padding: 25px;
            background: rgba(22, 33, 62, 0.8);
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        .chat-actions {
            margin-left: auto;
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            padding: 8px;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            color: var(--text-primary);
            border-color: var(--primary);
            background: var(--primary);
        }

        .messages-container {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: var(--background);
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            animation: messageAppear 0.3s ease-out;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 18px;
            color: var(--text-primary);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .message.other .message-bubble {
            background: rgba(26, 26, 46, 0.8);
            border-bottom-left-radius: 5px;
            border: 1px solid var(--border);
        }

        .message.own .message-bubble {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .message-sender {
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 5px;
            padding-left: 10px;
            font-weight: 500;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 5px;
            text-align: right;
        }

        .typing-indicator {
            padding: 10px 20px;
            color: var(--text-secondary);
            font-style: italic;
            font-size: 14px;
            display: none;
        }

        .input-area {
            padding: 25px;
            background: rgba(22, 33, 62, 0.8);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .message-input {
            flex: 1;
            padding: 16px 20px;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 35, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--sidebar);
            padding: 35px;
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            color: var(--text-primary);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: modalAppear 0.3s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal h3 {
            margin-bottom: 25px;
            color: var(--text-primary);
            font-size: 1.5em;
            text-align: center;
        }

        .group-members-list {
            max-height: 250px;
            overflow-y: auto;
            margin: 15px 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--background);
        }

        .member-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            transition: background 0.3s ease;
        }

        .member-item:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .member-item:last-child {
            border-bottom: none;
        }

        .member-checkbox {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .no-chats-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 50px 20px;
            font-size: 16px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid var(--sidebar);
        }

        .settings-modal {
            display: none;
            position: absolute;
            top: 90px;
            right: 20px;
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            z-index: 1001;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .settings-item {
            padding: 12px 16px;
            cursor: pointer;
            color: var(--text-primary);
            border-radius: 8px;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-item:hover {
            background: var(--background);
        }

        .settings-item.logout {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <!-- Экран аутентификации -->
    <div class="auth-container" id="authContainer">
        <h1>Wylow <span class="beta-badge">BETA 1.0</span></h1>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">Мессенджер нового поколения</p>
        
        <div class="auth-tabs">
            <div class="auth-tab active" id="loginTab">Вход</div>
            <div class="auth-tab" id="registerTab">Регистрация</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" class="form-control" id="loginUsername" required>
                <div class="error-message" id="loginUsernameError"></div>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" class="form-control" id="loginPassword" required>
                <div class="error-message" id="loginPasswordError"></div>
            </div>
            <button type="submit" class="btn-primary">Войти</button>
        </form>

        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" class="form-control" id="registerUsername" required>
                <div class="error-message" id="registerUsernameError"></div>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" class="form-control" id="registerPassword" required>
                <div class="error-message" id="registerPasswordError"></div>
            </div>
            <div class="form-group">
                <label>Подтверждение пароля</label>
                <input type="password" class="form-control" id="registerConfirmPassword" required>
                <div class="error-message" id="registerConfirmError"></div>
            </div>
            <button type="submit" class="btn-primary">Зарегистрироваться</button>
        </form>
    </div>

    <!-- Основной интерфейс мессенджера -->
    <div class="messenger-container" id="messengerContainer">
        <div class="sidebar">
            <div class="profile-section">
                <div class="profile-header">
                    <div class="avatar" id="userAvatar" onclick="document.getElementById('avatarInput').click()">
                        <input type="file" id="avatarInput" class="avatar-input" accept="image/*">
                    </div>
                    <div class="profile-info">
                        <h3 id="userName">Пользователь</h3>
                        <span id="userStatus">в сети</span>
                        <div class="profile-actions">
                            <button class="profile-btn" onclick="openSettings()">Настройки</button>
                            <button class="profile-btn" onclick="openProfileModal()">Профиль</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="settings-modal" id="settingsModal">
                <div class="settings-item" onclick="openProfileModal()">
                    <span>📝</span> Редактировать профиль
                </div>
                <div class="settings-item" onclick="changeStatus()">
                    <span>💬</span> Сменить статус
                </div>
                <div class="settings-item logout" onclick="logout()">
                    <span>🚪</span> Выйти
                </div>
            </div>

            <div class="search-container">
                <input type="text" class="search-box" id="userSearch" placeholder="Поиск пользователей...">
                <div class="search-results" id="searchResults"></div>
            </div>

            <div class="chats-list" id="chatsList">
                <div class="no-chats-message" id="noChatsMessage">
                    Начните общение - найдите пользователя выше
                </div>
            </div>

            <button class="new-group-btn" onclick="openNewGroupModal()">+ Создать группу</button>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-avatar" id="currentChatAvatar">
                    <div class="online-dot"></div>
                </div>
                <div class="chat-info">
                    <div class="chat-name" id="currentChatName">Выберите чат</div>
                    <div class="last-message" id="currentChatStatus">Начните общение</div>
                </div>
                <div class="chat-actions">
                    <button class="icon-btn" onclick="showChatInfo()">⚙️</button>
                </div>
            </div>

            <div class="messages-container" id="messagesArea">
                <div class="no-chats-message">
                    Выберите чат для начала общения
                </div>
                <div class="typing-indicator" id="typingIndicator"></div>
            </div>

            <div class="input-area">
                <input type="text" class="message-input" id="messageInput" placeholder="Введите сообщение..." disabled>
                <button class="send-btn" onclick="sendMessage()" disabled>➤</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <h3>Редактирование профиля</h3>
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" class="form-control" id="editUserName" placeholder="Введите имя">
            </div>
            <div class="form-group">
                <label>Статус</label>
                <input type="text" class="form-control" id="editUserStatus" placeholder="Введите статус">
            </div>
            <div class="form-group">
                <label>Сменить аватар</label>
                <input type="file" class="form-control" id="editAvatarInput" accept="image/*">
            </div>
            <button class="btn-primary" onclick="saveProfile()">Сохранить изменения</button>
            <button class="btn-danger" onclick="logout()">Выйти из аккаунта</button>
        </div>
    </div>

    <!-- Модальное окно новой группы -->
    <div class="modal" id="newGroupModal">
        <div class="modal-content">
            <h3>Создать новую группу</h3>
            <div class="form-group">
                <label>Название группы</label>
                <input type="text" class="form-control" id="newGroupName" placeholder="Введите название группы">
            </div>
            <div class="form-group">
                <label>Выберите участников:</label>
                <div class="group-members-list" id="groupMembersList">
                    <!-- Список контактов будет здесь -->
                </div>
            </div>
            <button class="btn-primary" onclick="createNewGroup()">Создать группу</button>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let currentUser = null;
        let currentChat = null;
        let socket = null;
        let typingTimer = null;

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            initialize();
        });

        // Основная функция инициализации
        async function initialize() {
            await checkAuthStatus();
            setupEventListeners();
        }

        // Проверка статуса аутентификации
        async function checkAuthStatus() {
            const savedUser = localStorage.getItem('wylow_current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                await connectToSocket();
                showMessenger();
                await loadUserChats();
            } else {
                showAuth();
            }
        }

        // Подключение к WebSocket
        async function connectToSocket() {
            socket = io();
            
            socket.on('connect', () => {
                console.log('Connected to server');
                socket.emit('user_connected', currentUser.id);
            });

            socket.on('new_message', (data) => {
                if (currentChat && data.chatId === currentChat.id) {
                    appendMessage(data.message);
                }
                loadUserChats(); // Обновляем список чатов
            });

            socket.on('user_status_changed', (data) => {
                updateUserStatus(data.userId, data.status);
            });

            socket.on('user_typing', (data) => {
                showTypingIndicator(data);
            });

            socket.on('user_stop_typing', (data) => {
                hideTypingIndicator(data.userId);
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
            });
        }

        // Показать экран аутентификации
        function showAuth() {
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('messengerContainer').style.display = 'none';
        }

        // Показать мессенджер
        function showMessenger() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('messengerContainer').style.display = 'flex';
            updateUserInterface();
        }

        // Настройка обработчиков событий
        function setupEventListeners() {
            // Переключение вкладок аутентификации
            document.getElementById('loginTab').addEventListener('click', () => switchAuthTab('login'));
            document.getElementById('registerTab').addEventListener('click', () => switchAuthTab('register'));
            
            // Формы
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('registerForm').addEventListener('submit', handleRegister);
            
            // Поиск
            document.getElementById('userSearch').addEventListener('input', handleUserSearch);
            
            // Загрузка аватарок
            document.getElementById('avatarInput').addEventListener('change', handleAvatarUpload);
            document.getElementById('editAvatarInput').addEventListener('change', handleEditAvatarUpload);
            
            // Сообщения
            const messageInput = document.getElementById('messageInput');
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Индикатор набора текста
            messageInput.addEventListener('input', function() {
                if (currentChat && socket) {
                    socket.emit('typing', {
                        userId: currentUser.id,
                        userName: currentUser.display_name || currentUser.username,
                        chatId: currentChat.id
                    });
                    
                    clearTimeout(typingTimer);
                    typingTimer = setTimeout(() => {
                        socket.emit('stop_typing', {
                            userId: currentUser.id,
                            chatId: currentChat.id
                        });
                    }, 1000);
                }
            });

            // Закрытие модальных окон
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.settings-modal') && !e.target.closest('.profile-header')) {
                    document.getElementById('settingsModal').style.display = 'none';
                }
            });
        }

        // Переключение между вкладками входа и регистрации
        function switchAuthTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginTab.classList.remove('active');
                registerTab.classList.add('active');
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        // Обработка входа
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            hideAllErrors();

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    currentUser = data;
                    localStorage.setItem('wylow_current_user', JSON.stringify(currentUser));
                    await connectToSocket();
                    showMessenger();
                    await loadUserChats();
                } else {
                    showError('loginPasswordError', data.error);
                }
            } catch (error) {
                showError('loginPasswordError', 'Ошибка соединения с сервером');
            }
        }

        // Обработка регистрации
        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            hideAllErrors();

            if (password !== confirmPassword) {
                showError('registerConfirmError', 'Пароли не совпадают');
                return;
            }

            if (password.length < 6) {
                showError('registerPasswordError', 'Пароль должен быть не менее 6 символов');
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    currentUser = data;
                    localStorage.setItem('wylow_current_user', JSON.stringify(currentUser));
                    await connectToSocket();
                    showMessenger();
                    await loadUserChats();
                } else {
                    showError('registerUsernameError', data.error);
                }
            } catch (error) {
                showError('registerUsernameError', 'Ошибка соединения с сервером');
            }
        }

        // Поиск пользователей
        async function handleUserSearch(e) {
            const query = e.target.value;
            const resultsContainer = document.getElementById('searchResults');

            if (query.length < 2) {
                resultsContainer.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`/api/users?search=${encodeURIComponent(query)}`);
                const users = await response.json();

                if (users && users.length > 0) {
                    const filteredUsers = users.filter(user => user.id !== currentUser.id);
                    
                    if (filteredUsers.length > 0) {
                        resultsContainer.innerHTML = filteredUsers.map(user => `
                            <div class="search-result-item" onclick="startChatWithUser('${user.id}')">
                                <div class="chat-avatar" style="background-image: url(${user.avatar || ''})">
                                    ${user.avatar ? '' : (user.display_name || user.username).charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <div style="font-weight: 600;">${user.display_name || user.username}</div>
                                    <div style="font-size: 12px; color: var(--text-secondary);">${user.status}</div>
                                </div>
                            </div>
                        `).join('');
                        resultsContainer.style.display = 'block';
                    } else {
                        resultsContainer.innerHTML = '<div class="search-result-item">Пользователи не найдены</div>';
                        resultsContainer.style.display = 'block';
                    }
                } else {
                    resultsContainer.innerHTML = '<div class="search-result-item">Пользователи не найдены</div>';
                    resultsContainer.style.display = 'block';
                }
            } catch (error) {
                console.error('Search error:', error);
                resultsContainer.innerHTML = '<div class="search-result-item">Ошибка поиска</div>';
                resultsContainer.style.display = 'block';
            }
        }

        // Начать чат с пользователем
        async function startChatWithUser(userId) {
            try {
                // Получаем информацию о пользователе
                const usersResponse = await fetch('/api/users');
                const users = await usersResponse.json();
                const user = users.find(u => u.id === userId);
                
                if (!user) {
                    alert('Пользователь не найден');
                    return;
                }

                document.getElementById('userSearch').value = '';
                document.getElementById('searchResults').style.display = 'none';

                // Проверяем, есть ли уже чат с этим пользователем
                const chatsResponse = await fetch(`/api/chats/${currentUser.id}`);
                const userChats = await chatsResponse.json();

                let existingChat = userChats.find(chat => 
                    chat.type === 'private' && 
                    chat.participants && 
                    chat.participants.includes(userId)
                );

                if (existingChat) {
                    openChat(existingChat);
                } else {
                    // Создаем новый чат
                    const newChatResponse = await fetch('/api/chats', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            name: user.display_name || user.username,
                            type: 'private',
                            participants: [currentUser.id, userId],
                            createdBy: currentUser.id
                        }),
                    });

                    if (newChatResponse.ok) {
                        const newChat = await newChatResponse.json();
                        // Загружаем обновленный список чатов
                        await loadUserChats();
                        // Находим новый чат в списке и открываем его
                        const updatedChatsResponse = await fetch(`/api/chats/${currentUser.id}`);
                        const updatedChats = await updatedChatsResponse.json();
                        const createdChat = updatedChats.find(chat => chat.id === newChat.id);
                        if (createdChat) {
                            openChat(createdChat);
                        }
                    } else {
                        alert('Ошибка создания чата');
                    }
                }
            } catch (error) {
                console.error('Error starting chat:', error);
                alert('Ошибка создания чата');
            }
        }

        // Загрузка чатов пользователя
        async function loadUserChats() {
            try {
                const response = await fetch(`/api/chats/${currentUser.id}`);
                if (response.ok) {
                    const chats = await response.json();
                    renderChatsList(chats);
                }
            } catch (error) {
                console.error('Error loading chats:', error);
            }
        }

        // Отображение списка чатов
        function renderChatsList(chats) {
            const chatsList = document.getElementById('chatsList');
            const noChatsMessage = document.getElementById('noChatsMessage');

            if (!chats || chats.length === 0) {
                noChatsMessage.style.display = 'block';
                chatsList.innerHTML = '';
                return;
            }

            noChatsMessage.style.display = 'none';

            // Сортируем чаты по времени последнего сообщения
            const sortedChats = [...chats].sort((a, b) => {
                const timeA = a.last_message_time ? new Date(a.last_message_time) : new Date(a.created_at);
                const timeB = b.last_message_time ? new Date(b.last_message_time) : new Date(b.created_at);
                return timeB - timeA;
            });

            chatsList.innerHTML = sortedChats.map(chat => {
                const isActive = currentChat && chat.id === currentChat.id;
                let avatar = chat.avatar || '';
                let name = chat.name;
                let lastMessage = chat.last_message || 'Нет сообщений';

                // Для приватных чатов получаем информацию о другом участнике
                if (chat.type === 'private') {
                    // Имя уже должно быть установлено сервером
                    lastMessage = chat.last_message || 'Начните общение';
                }

                return `
                    <div class="chat-item ${isActive ? 'active' : ''}" onclick="openChat(${JSON.stringify(chat).replace(/"/g, '&quot;')})">
                        <div class="chat-avatar" style="background-image: url(${avatar})">
                            ${avatar ? '' : name.charAt(0).toUpperCase()}
                            <div class="online-dot"></div>
                        </div>
                        <div class="chat-info">
                            <div class="chat-name">${name}</div>
                            <div class="last-message">${lastMessage}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Открытие чата
        async function openChat(chat) {
            currentChat = chat;

            // Обновляем заголовок чата
            document.getElementById('currentChatName').textContent = chat.name;
            document.getElementById('currentChatAvatar').style.backgroundImage = chat.avatar ? `url(${chat.avatar})` : '';
            document.getElementById('currentChatAvatar').textContent = chat.avatar ? '' : chat.name.charAt(0).toUpperCase();
            document.getElementById('currentChatStatus').textContent = 
                chat.type === 'group' ? `${chat.participant_count || '?'} участников` : 'в сети';

            // Активируем поле ввода
            document.getElementById('messageInput').disabled = false;
            document.querySelector('.send-btn').disabled = false;

            // Загружаем сообщения
            await loadMessages(chat.id);
            
            // Обновляем список чатов для подсветки активного
            await loadUserChats();
        }

        // Загрузка сообщений
        async function loadMessages(chatId) {
            try {
                const response = await fetch(`/api/messages/${chatId}`);
                if (response.ok) {
                    const messages = await response.json();
                    renderMessages(messages);
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Отображение сообщений
        function renderMessages(messages) {
            const messagesArea = document.getElementById('messagesArea');
            const noChatsMessage = messagesArea.querySelector('.no-chats-message');
            const typingIndicator = document.getElementById('typingIndicator');
            
            // Убираем сообщение "нет сообщений"
            if (noChatsMessage) {
                noChatsMessage.style.display = 'none';
            }
            
            if (!messages || messages.length === 0) {
                messagesArea.innerHTML = '<div class="no-chats-message">Нет сообщений</div>';
                if (typingIndicator) {
                    messagesArea.appendChild(typingIndicator);
                }
                return;
            }

            messagesArea.innerHTML = messages.map(msg => {
                const isOwn = msg.user_id === currentUser.id;
                const senderName = msg.display_name || msg.username;
                return `
                    <div class="message ${isOwn ? 'own' : 'other'}">
                        ${!isOwn ? `<div class="message-sender">${senderName}</div>` : ''}
                        <div class="message-bubble">${msg.text}</div>
                        <div class="message-time">${formatTime(msg.created_at)}</div>
                    </div>
                `;
            }).join('');

            // Добавляем индикатор набора текста обратно
            if (typingIndicator) {
                messagesArea.appendChild(typingIndicator);
            }

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Добавление нового сообщения
        function appendMessage(message) {
            const messagesArea = document.getElementById('messagesArea');
            const noChatsMessage = messagesArea.querySelector('.no-chats-message');
            
            if (noChatsMessage) {
                noChatsMessage.style.display = 'none';
            }

            const isOwn = message.user_id === currentUser.id;
            const senderName = message.display_name || message.username;

            const messageElement = document.createElement('div');
            messageElement.className = `message ${isOwn ? 'own' : 'other'}`;
            messageElement.innerHTML = `
                ${!isOwn ? `<div class="message-sender">${senderName}</div>` : ''}
                <div class="message-bubble">${message.text}</div>
                <div class="message-time">${formatTime(message.created_at)}</div>
            `;

            messagesArea.appendChild(messageElement);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Отправка сообщения
        async function sendMessage() {
            if (!currentChat) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;

            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chatId: currentChat.id,
                        userId: currentUser.id,
                        text: text
                    }),
                });

                if (response.ok) {
                    input.value = '';
                    // Сообщение будет добавлено через WebSocket
                } else {
                    console.error('Error sending message');
                    alert('Ошибка отправки сообщения');
                }
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Ошибка соединения');
            }
        }

        // Показать индикатор набора текста
        function showTypingIndicator(data) {
            if (currentChat && data.chatId === currentChat.id && data.userId !== currentUser.id) {
                const typingIndicator = document.getElementById('typingIndicator');
                typingIndicator.textContent = `${data.userName} печатает...`;
                typingIndicator.style.display = 'block';
                
                // Автоматически скрываем через 3 секунды
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                }, 3000);
            }
        }

        // Скрыть индикатор набора текста
        function hideTypingIndicator(userId) {
            const typingIndicator = document.getElementById('typingIndicator');
            typingIndicator.style.display = 'none';
        }

        // Открытие модального окна новой группы
        async function openNewGroupModal() {
            try {
                const response = await fetch('/api/users');
                if (response.ok) {
                    const users = await response.json();
                    const contacts = users.filter(user => user.id !== currentUser.id);
                    
                    document.getElementById('groupMembersList').innerHTML = contacts.map(user => `
                        <div class="member-item">
                            <input type="checkbox" class="member-checkbox" value="${user.id}">
                            <div class="chat-avatar" style="background-image: url(${user.avatar || ''})">
                                ${user.avatar ? '' : (user.display_name || user.username).charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <div style="font-weight: 600;">${user.display_name || user.username}</div>
                                <div style="font-size: 12px; color: var(--text-secondary);">${user.status}</div>
                            </div>
                        </div>
                    `).join('');

                    document.getElementById('newGroupModal').style.display = 'flex';
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Создание новой группы
        async function createNewGroup() {
            const groupName = document.getElementById('newGroupName').value;
            if (!groupName) {
                alert('Введите название группы');
                return;
            }

            const selectedMembers = Array.from(document.querySelectorAll('.member-checkbox:checked'))
                .map(checkbox => checkbox.value);

            if (selectedMembers.length === 0) {
                alert('Выберите хотя бы одного участника');
                return;
            }

            try {
                const response = await fetch('/api/chats', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: groupName,
                        type: 'group',
                        participants: [currentUser.id, ...selectedMembers],
                        createdBy: currentUser.id
                    }),
                });

                if (response.ok) {
                    const newChat = await response.json();
                    document.getElementById('newGroupModal').style.display = 'none';
                    document.getElementById('newGroupName').value = '';
                    
                    // Загружаем обновленный список чатов
                    await loadUserChats();
                    
                    // Находим и открываем новый чат
                    const chatsResponse = await fetch(`/api/chats/${currentUser.id}`);
                    const chats = await chatsResponse.json();
                    const createdChat = chats.find(chat => chat.id === newChat.id);
                    if (createdChat) {
                        openChat(createdChat);
                    }
                } else {
                    const error = await response.json();
                    alert(error.error || 'Ошибка создания группы');
                }
            } catch (error) {
                console.error('Error creating group:', error);
                alert('Ошибка создания группы');
            }
        }

        // Загрузка аватарки
        async function handleAvatarUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('avatar', file);
            formData.append('userId', currentUser.id);

            try {
                const response = await fetch('/api/upload-avatar', {
                    method: 'POST',
                    body: formData,
                });

                if (response.ok) {
                    const data = await response.json();
                    currentUser.avatar = data.avatar;
                    localStorage.setItem('wylow_current_user', JSON.stringify(currentUser));
                    updateUserInterface();
                } else {
                    alert('Ошибка загрузки аватарки');
                }
            } catch (error) {
                console.error('Error uploading avatar:', error);
                alert('Ошибка загрузки аватарки');
            }
        }

        function handleEditAvatarUpload(e) {
            handleAvatarUpload(e);
        }

        // Открытие настроек
        function openSettings() {
            const settingsModal = document.getElementById('settingsModal');
            settingsModal.style.display = settingsModal.style.display === 'block' ? 'none' : 'block';
        }

        // Открытие модального окна профиля
        function openProfileModal() {
            document.getElementById('editUserName').value = currentUser.display_name || currentUser.username;
            document.getElementById('editUserStatus').value = currentUser.status;
            document.getElementById('profileModal').style.display = 'flex';
            document.getElementById('settingsModal').style.display = 'none';
        }

        // Сохранение профиля
        async function saveProfile() {
            const displayName = document.getElementById('editUserName').value;
            const status = document.getElementById('editUserStatus').value;

            try {
                const response = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        display_name: displayName,
                        status: status
                    }),
                });

                if (response.ok) {
                    currentUser.display_name = displayName;
                    currentUser.status = status;
                    localStorage.setItem('wylow_current_user', JSON.stringify(currentUser));
                    updateUserInterface();
                    document.getElementById('profileModal').style.display = 'none';
                    
                    // Обновляем список чатов для отображения новых данных
                    await loadUserChats();
                } else {
                    alert('Ошибка сохранения профиля');
                }
            } catch (error) {
                console.error('Error updating profile:', error);
                alert('Ошибка сохранения профиля');
            }
        }

        // Смена статуса
        function changeStatus() {
            const newStatus = prompt('Введите новый статус:', currentUser.status);
            if (newStatus !== null) {
                currentUser.status = newStatus;
                localStorage.setItem('wylow_current_user', JSON.stringify(currentUser));
                updateUserInterface();
                
                // Обновляем на сервере
                fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        display_name: currentUser.display_name,
                        status: newStatus
                    }),
                });
            }
            document.getElementById('settingsModal').style.display = 'none';
        }

        // Выход из системы
        function logout() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                if (socket) {
                    socket.disconnect();
                }
                localStorage.removeItem('wylow_current_user');
                currentUser = null;
                currentChat = null;
                showAuth();
            }
        }

        // Обновление интерфейса пользователя
        function updateUserInterface() {
            if (!currentUser) return;

            document.getElementById('userName').textContent = currentUser.display_name || currentUser.username;
            document.getElementById('userStatus').textContent = currentUser.status;
            
            const avatarElement = document.getElementById('userAvatar');
            if (currentUser.avatar) {
                avatarElement.style.backgroundImage = `url(${currentUser.avatar})`;
                avatarElement.textContent = '';
            } else {
                avatarElement.style.backgroundImage = '';
                avatarElement.textContent = (currentUser.display_name || currentUser.username).charAt(0).toUpperCase();
            }
        }

        // Обновление статуса пользователя
        function updateUserStatus(userId, status) {
            // Здесь можно реализовать обновление статуса в списке чатов
            console.log(`User ${userId} status changed to ${status}`);
        }

        // Форматирование времени
        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('ru-RU', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        // Показать информацию о чате
        function showChatInfo() {
            if (!currentChat) return;
            
            alert(`Информация о чате:\nНазвание: ${currentChat.name}\nТип: ${currentChat.type === 'group' ? 'Групповой' : 'Личный'}\nУчастников: ${currentChat.participant_count || '?'}`);
        }

        // Вспомогательные функции для ошибок
        function hideAllErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        // Закрытие модальных окон при клике вне их
        window.onclick = function(event) {
            const modals = document.getElementsByClassName('modal');
            for (let modal of modals) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            }
        }
    </script>
