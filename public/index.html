<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Wylow Messenger BETA 1.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --background: #0f0f23;
            --sidebar: #1a1a2e;
            --chat-area: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border: #2d3748;
            --success: #10b981;
            --danger: #ef4444;
            --accent: #06b6d4;
        }

        body {
            background: linear-gradient(135deg, #0f0f23, #1a1a2e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Стили для экрана аутентификации */
        .auth-container {
            background: var(--sidebar);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
            color: var(--text-primary);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .auth-container h1 {
            margin-bottom: 10px;
            color: var(--primary);
            font-size: 2.5em;
            font-weight: 300;
        }

        .beta-badge {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            margin-left: 10px;
            font-weight: 600;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            background: var(--background);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .auth-tab.active {
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .error-message {
            color: var(--danger);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* Стили мессенджера */
        .messenger-container {
            width: 95vw;
            height: 95vh;
            background: var(--background);
            border-radius: 25px;
            display: flex;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            display: none;
            border: 1px solid var(--border);
        }

        .sidebar {
            width: 380px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .profile-section {
            padding: 25px;
            background: rgba(26, 26, 46, 0.8);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-primary);
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--primary);
            transition: all 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .avatar-input {
            display: none;
        }

        .profile-info {
            flex: 1;
        }

        .profile-info h3 {
            margin-bottom: 5px;
            font-weight: 600;
        }

        .profile-info span {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .profile-btn {
            padding: 8px 16px;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .profile-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .search-container {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 14px 45px 14px 16px;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-results {
            position: absolute;
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 8px;
            width: calc(100% - 40px);
            max-height: 250px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .search-result-item {
            padding: 12px 16px;
            cursor: pointer;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-result-item:hover {
            background: var(--background);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .chat-item {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .chat-item:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .chat-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-left: 4px solid var(--primary);
        }

        .chat-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            transition: width 0.3s ease;
        }

        .chat-item:hover::before {
            width: 100%;
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .chat-item:hover .chat-avatar {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .chat-info {
            flex: 1;
            position: relative;
            z-index: 2;
        }

        .chat-name {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .last-message {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .new-group-btn {
            margin: 20px;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .new-group-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-area);
            position: relative;
        }

        .chat-header {
            padding: 25px;
            background: rgba(22, 33, 62, 0.8);
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        .chat-actions {
            margin-left: auto;
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            padding: 8px;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            color: var(--text-primary);
            border-color: var(--primary);
            background: var(--primary);
        }

        .messages-container {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: var(--background);
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            animation: messageAppear 0.3s ease-out;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 18px;
            color: var(--text-primary);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .message.other .message-bubble {
            background: rgba(26, 26, 46, 0.8);
            border-bottom-left-radius: 5px;
            border: 1px solid var(--border);
        }

        .message.own .message-bubble {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .message-sender {
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 5px;
            padding-left: 10px;
            font-weight: 500;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 5px;
            text-align: right;
        }

        .input-area {
            padding: 25px;
            background: rgba(22, 33, 62, 0.8);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .message-input {
            flex: 1;
            padding: 16px 20px;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 35, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--sidebar);
            padding: 35px;
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            color: var(--text-primary);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: modalAppear 0.3s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal h3 {
            margin-bottom: 25px;
            color: var(--text-primary);
            font-size: 1.5em;
            text-align: center;
        }

        .group-members-list {
            max-height: 250px;
            overflow-y: auto;
            margin: 15px 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--background);
        }

        .member-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            transition: background 0.3s ease;
        }

        .member-item:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .member-item:last-child {
            border-bottom: none;
        }

        .member-checkbox {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .no-chats-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 50px 20px;
            font-size: 16px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid var(--sidebar);
        }

        .settings-modal {
            display: none;
            position: absolute;
            top: 90px;
            right: 20px;
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            z-index: 1001;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .settings-item {
            padding: 12px 16px;
            cursor: pointer;
            color: var(--text-primary);
            border-radius: 8px;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-item:hover {
            background: var(--background);
        }

        .settings-item.logout {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <!-- Экран аутентификации -->
    <div class="auth-container" id="authContainer">
        <h1>Wylow <span class="beta-badge">BETA 1.0</span></h1>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">Мессенджер нового поколения</p>
        
        <div class="auth-tabs">
            <div class="auth-tab active" id="loginTab">Вход</div>
            <div class="auth-tab" id="registerTab">Регистрация</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" class="form-control" id="loginUsername" required>
                <div class="error-message" id="loginUsernameError"></div>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" class="form-control" id="loginPassword" required>
                <div class="error-message" id="loginPasswordError"></div>
            </div>
            <button type="submit" class="btn-primary">Войти</button>
        </form>

        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" class="form-control" id="registerUsername" required>
                <div class="error-message" id="registerUsernameError"></div>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" class="form-control" id="registerPassword" required>
                <div class="error-message" id="registerPasswordError"></div>
            </div>
            <div class="form-group">
                <label>Подтверждение пароля</label>
                <input type="password" class="form-control" id="registerConfirmPassword" required>
                <div class="error-message" id="registerConfirmError"></div>
            </div>
            <button type="submit" class="btn-primary">Зарегистрироваться</button>
        </form>
    </div>

    <!-- Основной интерфейс мессенджера -->
    <div class="messenger-container" id="messengerContainer">
        <div class="sidebar">
            <div class="profile-section">
                <div class="profile-header">
                    <div class="avatar" id="userAvatar" onclick="document.getElementById('avatarInput').click()">
                        <input type="file" id="avatarInput" class="avatar-input" accept="image/*">
                    </div>
                    <div class="profile-info">
                        <h3 id="userName">Пользователь</h3>
                        <span id="userStatus">в сети</span>
                        <div class="profile-actions">
                            <button class="profile-btn" onclick="openSettings()">Настройки</button>
                            <button class="profile-btn" onclick="openProfileModal()">Профиль</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="settings-modal" id="settingsModal">
                <div class="settings-item" onclick="openProfileModal()">
                    <span>📝</span> Редактировать профиль
                </div>
                <div class="settings-item" onclick="changeStatus()">
                    <span>💬</span> Сменить статус
                </div>
                <div class="settings-item logout" onclick="logout()">
                    <span>🚪</span> Выйти
                </div>
            </div>

            <div class="search-container">
                <input type="text" class="search-box" id="userSearch" placeholder="Поиск пользователей...">
                <div class="search-results" id="searchResults"></div>
            </div>

            <div class="chats-list" id="chatsList">
                <div class="no-chats-message" id="noChatsMessage">
                    Начните общение - найдите пользователя выше
                </div>
            </div>

            <button class="new-group-btn" onclick="openNewGroupModal()">+ Создать группу</button>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-avatar" id="currentChatAvatar">
                    <div class="online-dot"></div>
                </div>
                <div class="chat-info">
                    <div class="chat-name" id="currentChatName">Выберите чат</div>
                    <div class="last-message" id="currentChatStatus">Начните общение</div>
                </div>
                <div class="chat-actions">
                    <button class="icon-btn" onclick="showChatInfo()">⚙️</button>
                </div>
            </div>

            <div class="messages-container" id="messagesArea">
                <div class="no-chats-message">
                    Выберите чат для начала общения
                </div>
            </div>

            <div class="input-area">
                <input type="text" class="message-input" id="messageInput" placeholder="Введите сообщение..." disabled>
                <button class="send-btn" onclick="sendMessage()" disabled>➤</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <h3>Редактирование профиля</h3>
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" class="form-control" id="editUserName" placeholder="Введите имя">
            </div>
            <div class="form-group">
                <label>Статус</label>
                <input type="text" class="form-control" id="editUserStatus" placeholder="Введите статус">
            </div>
            <div class="form-group">
                <label>Сменить аватар</label>
                <input type="file" class="form-control" id="editAvatarInput" accept="image/*">
            </div>
            <button class="btn-primary" onclick="saveProfile()">Сохранить изменения</button>
            <button class="btn-danger" onclick="logout()">Выйти из аккаунта</button>
        </div>
    </div>

    <!-- Модальное окно новой группы -->
    <div class="modal" id="newGroupModal">
        <div class="modal-content">
            <h3>Создать новую группу</h3>
            <div class="form-group">
                <label>Название группы</label>
                <input type="text" class="form-control" id="newGroupName" placeholder="Введите название группы">
            </div>
            <div class="form-group">
                <label>Выберите участников:</label>
                <div class="group-members-list" id="groupMembersList">
                    <!-- Список контактов будет здесь -->
                </div>
            </div>
            <button class="btn-primary" onclick="createNewGroup()">Создать группу</button>
        </div>
    </div>

    <script>
        // База данных
        const DB = {
            users: 'wylow_users',
            chats: 'wylow_chats',
            currentUser: 'wylow_current_user'
        };

        let currentUser = null;
        let currentChat = null;
        let allUsers = [];
        let userChats = [];

        // Инициализация
        function initialize() {
            loadAllUsers();
            checkAuthStatus();
            setupEventListeners();
        }

        function loadAllUsers() {
            const users = localStorage.getItem(DB.users);
            allUsers = users ? JSON.parse(users) : [];
        }

        function saveAllUsers() {
            localStorage.setItem(DB.users, JSON.stringify(allUsers));
        }

        function checkAuthStatus() {
            const savedUser = localStorage.getItem(DB.currentUser);
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showMessenger();
            } else {
                showAuth();
            }
        }

        function showAuth() {
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('messengerContainer').style.display = 'none';
        }

        function showMessenger() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('messengerContainer').style.display = 'flex';
            updateUserInterface();
            loadUserChats();
        }

        function setupEventListeners() {
            document.getElementById('loginTab').addEventListener('click', () => switchAuthTab('login'));
            document.getElementById('registerTab').addEventListener('click', () => switchAuthTab('register'));
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('registerForm').addEventListener('submit', handleRegister);
            document.getElementById('userSearch').addEventListener('input', handleUserSearch);
            document.getElementById('avatarInput').addEventListener('change', handleAvatarUpload);
            document.getElementById('editAvatarInput').addEventListener('change', handleEditAvatarUpload);
            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });
            
            // Закрытие модальных окон при клике вне
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.settings-modal') && !e.target.closest('.profile-header')) {
                    document.getElementById('settingsModal').style.display = 'none';
                }
            });
        }

        function switchAuthTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            loginTab.classList.toggle('active', tab === 'login');
            registerTab.classList.toggle('active', tab === 'register');
            loginForm.style.display = tab === 'login' ? 'block' : 'none';
            registerForm.style.display = tab === 'register' ? 'block' : 'none';
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            hideAllErrors();

            const user = allUsers.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = user;
                localStorage.setItem(DB.currentUser, JSON.stringify(user));
                showMessenger();
            } else {
                showError('loginPasswordError', 'Неверный логин или пароль');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            hideAllErrors();

            if (allUsers.find(u => u.username === username)) {
                showError('registerUsernameError', 'Пользователь с таким логином уже существует');
                return;
            }

            if (password !== confirmPassword) {
                showError('registerConfirmError', 'Пароли не совпадают');
                return;
            }

            if (password.length < 6) {
                showError('registerPasswordError', 'Пароль должен быть не менее 6 символов');
                return;
            }

            const newUser = {
                id: 'user_' + Date.now(),
                username: username,
                password: password,
                displayName: username,
                avatar: '',
                status: 'в сети',
                createdAt: new Date().toISOString()
            };

            allUsers.push(newUser);
            saveAllUsers();

            currentUser = newUser;
            localStorage.setItem(DB.currentUser, JSON.stringify(newUser));
            showMessenger();
        }

        function handleUserSearch(e) {
            const query = e.target.value.toLowerCase();
            const resultsContainer = document.getElementById('searchResults');

            if (query.length < 2) {
                resultsContainer.style.display = 'none';
                return;
            }

            const filteredUsers = allUsers.filter(user => 
                user.username.toLowerCase().includes(query) && 
                user.id !== currentUser.id
            );

            if (filteredUsers.length > 0) {
                resultsContainer.innerHTML = filteredUsers.map(user => `
                    <div class="search-result-item" onclick="startChatWithUser('${user.id}')">
                        <div class="chat-avatar" style="background-image: url(${user.avatar})">
                            ${user.avatar ? '' : user.username.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <div style="font-weight: 600;">${user.username}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">${user.status}</div>
                        </div>
                    </div>
                `).join('');
                resultsContainer.style.display = 'block';
            } else {
                resultsContainer.innerHTML = '<div class="search-result-item">Пользователи не найдены</div>';
                resultsContainer.style.display = 'block';
            }
        }

        function startChatWithUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            document.getElementById('userSearch').value = '';
            document.getElementById('searchResults').style.display = 'none';

            let chat = userChats.find(c => 
                c.type === 'private' && 
                c.participants.includes(userId)
            );

            if (!chat) {
                chat = {
                    id: 'chat_' + Date.now(),
                    type: 'private',
                    name: user.username,
                    participants: [currentUser.id, userId],
                    avatar: user.avatar,
                    lastMessage: '',
                    lastMessageTime: new Date().toISOString(),
                    messages: []
                };
                userChats.push(chat);
                saveUserChats();
            }

            openChat(chat.id);
        }

        function loadUserChats() {
            const chats = localStorage.getItem(DB.chats);
            userChats = chats ? JSON.parse(chats) : [];
            userChats = userChats.filter(chat => chat.participants.includes(currentUser.id));
            renderChatsList();
        }

        function saveUserChats() {
            localStorage.setItem(DB.chats, JSON.stringify(userChats));
        }

        function renderChatsList() {
            const chatsList = document.getElementById('chatsList');
            const noChatsMessage = document.getElementById('noChatsMessage');

            if (userChats.length === 0) {
                noChatsMessage.style.display = 'block';
                chatsList.innerHTML = '';
                return;
            }

            noChatsMessage.style.display = 'none';

            userChats.sort((a, b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime));

            chatsList.innerHTML = userChats.map(chat => {
                let avatar = chat.avatar;
                let name = chat.name;
                let status = '';

                if (chat.type === 'private') {
                    const otherParticipantId = chat.participants.find(id => id !== currentUser.id);
                    const otherUser = allUsers.find(u => u.id === otherParticipantId);
                    if (otherUser) {
                        avatar = otherUser.avatar;
                        name = otherUser.username;
                        status = otherUser.status;
                    }
                }

                return `
                    <div class="chat-item ${currentChat === chat.id ? 'active' : ''}" onclick="openChat('${chat.id}')">
                        <div class="chat-avatar" style="background-image: url(${avatar})">
                            ${avatar ? '' : name.charAt(0).toUpperCase()}
                            <div class="online-dot"></div>
                        </div>
                        <div class="chat-info">
                            <div class="chat-name">${name}</div>
                            <div class="last-message">${chat.lastMessage || 'Нет сообщений'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openChat(chatId) {
            currentChat = chatId;
            const chat = userChats.find(c => c.id === chatId);
            
            if (!chat) return;

            let avatar = chat.avatar;
            let name = chat.name;
            let status = chat.type === 'group' ? `${chat.participants.length} участников` : 'в сети';

            if (chat.type === 'private') {
                const otherParticipantId = chat.participants.find(id => id !== currentUser.id);
                const otherUser = allUsers.find(u => u.id === otherParticipantId);
                if (otherUser) {
                    avatar = otherUser.avatar;
                    name = otherUser.username;
                    status = otherUser.status;
                }
            }

            document.getElementById('currentChatName').textContent = name;
            document.getElementById('currentChatAvatar').style.backgroundImage = avatar ? `url(${avatar})` : '';
            document.getElementById('currentChatAvatar').textContent = avatar ? '' : name.charAt(0).toUpperCase();
            document.getElementById('currentChatStatus').textContent = status;

            document.getElementById('messageInput').disabled = false;
            document.querySelector('.send-btn').disabled = false;

            loadMessages(chat.messages);
            renderChatsList();
        }

        function loadMessages(messages) {
            const messagesArea = document.getElementById('messagesArea');
            
            if (messages.length === 0) {
                messagesArea.innerHTML = '<div class="no-chats-message">Нет сообщений</div>';
                return;
            }

            messagesArea.innerHTML = messages.map(msg => {
                const isOwn = msg.senderId === currentUser.id;
                const sender = allUsers.find(u => u.id === msg.senderId);
                return `
                    <div class="message ${isOwn ? 'own' : 'other'}">
                        ${!isOwn ? `<div class="message-sender">${sender ? sender.username : 'Неизвестный'}</div>` : ''}
                        <div class="message-bubble">${msg.text}</div>
                        <div class="message-time">${formatTime(msg.time)}</div>
                    </div>
                `;
            }).join('');

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function sendMessage() {
            if (!currentChat) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;

            const chatIndex = userChats.findIndex(c => c.id === currentChat);
            if (chatIndex === -1) return;

            const newMessage = {
                id: 'msg_' + Date.now(),
                text: text,
                senderId: currentUser.id,
                time: new Date().toISOString()
            };

            userChats[chatIndex].messages.push(newMessage);
            userChats[chatIndex].lastMessage = text.length > 30 ? text.substring(0, 30) + '...' : text;
            userChats[chatIndex].lastMessageTime = new Date().toISOString();

            saveUserChats();
            
            input.value = '';
            loadMessages(userChats[chatIndex].messages);
            renderChatsList();
        }

        function openNewGroupModal() {
            const contactUserIds = new Set();
            userChats.forEach(chat => {
                if (chat.type === 'private') {
                    chat.participants.forEach(id => {
                        if (id !== currentUser.id) contactUserIds.add(id);
                    });
                }
            });

            const contacts = allUsers.filter(user => contactUserIds.has(user.id));
            
            document.getElementById('groupMembersList').innerHTML = contacts.map(user => `
                <div class="member-item">
                    <input type="checkbox" class="member-checkbox" value="${user.id}">
                    <div class="chat-avatar" style="background-image: url(${user.avatar})">
                        ${user.avatar ? '' : user.username.charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <div style="font-weight: 600;">${user.username}</div>
                        <div style="font-size: 12px; color: var(--text-secondary);">${user.status}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('newGroupModal').style.display = 'flex';
        }

        function createNewGroup() {
            const groupName = document.getElementById('newGroupName').value;
            if (!groupName) {
                alert('Введите название группы');
                return;
            }

            const selectedMembers = Array.from(document.querySelectorAll('.member-checkbox:checked'))
                .map(checkbox => checkbox.value);

            if (selectedMembers.length === 0) {
                alert('Выберите хотя бы одного участника');
                return;
            }

            const newGroup = {
                id: 'chat_' + Date.now(),
                type: 'group',
                name: groupName,
                participants: [currentUser.id, ...selectedMembers],
                avatar: '',
                lastMessage: '',
                lastMessageTime: new Date().toISOString(),
                messages: []
            };

            userChats.push(newGroup);
            saveUserChats();
            
            document.getElementById('newGroupModal').style.display = 'none';
            document.getElementById('newGroupName').value = '';
            renderChatsList();
            openChat(newGroup.id);
        }

        function handleAvatarUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentUser.avatar = e.target.result;
                localStorage.setItem(DB.currentUser, JSON.stringify(currentUser));
                
                const userIndex = allUsers.findIndex(u => u.id === currentUser.id);
                if (userIndex !== -1) {
                    allUsers[userIndex].avatar = e.target.result;
                    saveAllUsers();
                }

                updateUserInterface();
            };
            reader.readAsDataURL(file);
        }

        function handleEditAvatarUpload(e) {
            handleAvatarUpload(e);
        }

        function openSettings() {
            const settingsModal = document.getElementById('settingsModal');
            settingsModal.style.display = settingsModal.style.display === 'block' ? 'none' : 'block';
        }

        function openProfileModal() {
            document.getElementById('editUserName').value = currentUser.displayName || currentUser.username;
            document.getElementById('editUserStatus').value = currentUser.status;
            document.getElementById('profileModal').style.display = 'flex';
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveProfile() {
            const displayName = document.getElementById('editUserName').value;
            const status = document.getElementById('editUserStatus').value;

            currentUser.displayName = displayName;
            currentUser.status = status;
            
            localStorage.setItem(DB.currentUser, JSON.stringify(currentUser));
            
            const userIndex = allUsers.findIndex(u => u.id === currentUser.id);
            if (userIndex !== -1) {
                allUsers[userIndex].displayName = displayName;
                allUsers[userIndex].status = status;
                saveAllUsers();
            }

            updateUserInterface();
            document.getElementById('profileModal').style.display = 'none';
        }

        function changeStatus() {
            const newStatus = prompt('Введите новый статус:', currentUser.status);
            if (newStatus !== null) {
                currentUser.status = newStatus;
                localStorage.setItem(DB.currentUser, JSON.stringify(currentUser));
                
                const userIndex = allUsers.findIndex(u => u.id === currentUser.id);
                if (userIndex !== -1) {
                    allUsers[userIndex].status = newStatus;
                    saveAllUsers();
                }
                updateUserInterface();
            }
            document.getElementById('settingsModal').style.display = 'none';
        }

        function logout() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.removeItem(DB.currentUser);
                currentUser = null;
                currentChat = null;
                showAuth();
            }
        }

        function updateUserInterface() {
            if (!currentUser) return;

            document.getElementById('userName').textContent = currentUser.displayName || currentUser.username;
            document.getElementById('userStatus').textContent = currentUser.status;
            
            const avatarElement = document.getElementById('userAvatar');
            if (currentUser.avatar) {
                avatarElement.style.backgroundImage = `url(${currentUser.avatar})`;
                avatarElement.textContent = '';
            } else {
                avatarElement.style.backgroundImage = '';
                avatarElement.textContent = (currentUser.displayName || currentUser.username).charAt(0).toUpperCase();
            }
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('ru-RU', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function showChatInfo() {
            if (!currentChat) return;
            
            const chat = userChats.find(c => c.id === currentChat);
            if (chat) {
                const participantNames = chat.participants
                    .map(id => allUsers.find(u => u.id === id)?.username || 'Неизвестный')
                    .join(', ');
                
                alert(`Информация о чате:\nНазвание: ${chat.name}\nТип: ${chat.type === 'group' ? 'Групповой' : 'Личный'}\nУчастники: ${participantNames}\nСообщений: ${chat.messages.length}`);
            }
        }

        function hideAllErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        // Закрытие модальных окон при клике вне
        window.onclick = function(event) {
            const modals = document.getElementsByClassName('modal');
            for (let modal of modals) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            }
        }

        // Инициализация при загрузке
        window.onload = initialize;
    </script>
</body>
</html>
